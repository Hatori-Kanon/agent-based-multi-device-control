<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<!--
  手机急停页（A1-T9，v2「墨金」重做）。

  只做视觉与文案排版：内联脚本里的 token 读取、接口路径、成功/失败反馈与
  「单次点按即急停」的防误触策略都保持原样，协议没有改动。

  token 约定（与其它两页一致）：页面本身不带 token 也能打开（页面导航没法带
  请求头），所有 API 调用都带 `x-control-token`；本页从地址栏 ?token= 读一次，
  存进本机 localStorage，之后只从输入框取值。

  本页不采集摄像头/麦克风：手机浏览器要 HTTPS 才给 getUserMedia，M2 的采集
  仍然留在 PC 的 USB 摄像头上（实施计划 §8.1 冲突 #4）。

  CSP 说明（刻意保持最小）：静态白名单只放行 phone.html（没有 phone.js），
  急停逻辑只能写在页内，所以 script-src 需要 'unsafe-inline'——这与改造前
  逐字一致；新增的只有 style-src 的 'self'，因为共享样式表是同源 /style.css。
  没有放开 img-src / script-src 'self'：本页不加载图片，也没有外部脚本。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>Embodied 手机急停</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<style>
  /* 本页只补 style.css 没覆盖的排版；颜色、圆角、字体全部取自设计令牌。 */

  /* style.css 的 app 外壳默认 overflow:hidden；手机急停页需要能上下滚动。 */
  body.phone-page {
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* 手机优先的窄列：内容短时垂直居中，屏幕矮到放不下时从顶部开始并可滚动。 */
  .phone-page .phone {
    justify-content: flex-start;
    gap: 16px;
    max-width: 440px;
    margin: 0 auto;
    padding-top: 30px;
  }

  @media (min-height: 780px) {
    .phone-page .phone {
      justify-content: center;
      /* 内容意外变高（很长的一行错误）时退回顶部对齐，避免顶部被裁掉。 */
      justify-content: safe center;
    }
  }

  .phone-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }

  /* 已锁定横幅：借用全站 .lock-banner，只改成本页需要的宽度/边距。 */
  .phone-page #locked-banner {
    width: 100%;
    margin: 0;
    font-size: 12.5px;
    line-height: 1.6;
    text-align: left;
  }

  /* 圆钮在手机竖屏上占满一列；桌面宽度下稍微放大一点，避免显得太小。 */
  .phone-page .phone-dial {
    width: min(74vw, 320px);
    margin: 2px 0;
  }

  @media (min-width: 760px) {
    .phone-page .phone-dial {
      width: 340px;
    }
  }

  /* 锁定后按钮禁用，给一个明确的「不可再按」视觉。 */
  .phone-page .phone-stop:disabled {
    opacity: 0.55;
    filter: saturate(0.65);
    cursor: not-allowed;
    transform: none;
  }

  .phone-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-height: 48px;
  }

  #status {
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.6;
    max-width: 34ch;
    word-break: break-word;
  }

  /* token 卡片：只在需要人工粘贴 token 时出现，但始终保留在流里。 */
  .phone-token {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: linear-gradient(180deg, rgba(24, 28, 36, 0.82), rgba(17, 20, 26, 0.82));
    text-align: left;
  }

  .phone-token-label {
    display: block;
    margin-bottom: 8px;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .token-row {
    display: flex;
    gap: 8px;
  }

  .token-row input {
    flex: 1;
    min-width: 0;
  }

  #message {
    min-height: 18px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    word-break: break-word;
  }

  /* 成功/失败反馈用一个轻量色条区分，不改文案。 */
  #message.ok {
    color: var(--ok);
  }

  #message.bad {
    color: var(--bad);
  }
</style>
</head>
<body class="phone-page">
<main class="phone">
  <header class="phone-head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-title">Embodied</span>
      <span class="brand-sub">手机急停</span>
    </div>
  </header>

  <div id="locked-banner" class="lock-banner" role="alert">
    <span>输出已被锁定</span>
  </div>

  <div class="phone-dial">
    <button id="panic-button" class="phone-stop" type="button">紧急停止</button>
  </div>

  <div class="phone-state" aria-live="polite">
    <span id="status-pill" class="pill off">正在读取</span>
    <span id="status">正在读取状态…</span>
  </div>

  <section class="phone-token">
    <label class="phone-token-label" for="token">token</label>
    <div class="token-row">
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="token">
      <button id="save-token" class="btn btn-sm" type="button">保存</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
  (() => {
    const STORAGE_KEY = 'embodied.dashboard.token'
    const tokenInput = document.getElementById('token')
    const panicButton = document.getElementById('panic-button')
    const lockedBanner = document.getElementById('locked-banner')
    const statusPill = document.getElementById('status-pill')
    const statusLine = document.getElementById('status')
    const messageLine = document.getElementById('message')

    // 控制台发出去的 URL 形如 /?token=...；手机端可以把整个地址粘进来。
    // localStorage 在隐私模式/存储被禁用时会抛异常——急停页不能因此整段脚本中断。
    const fromQuery = new URLSearchParams(location.search).get('token')
    let stored = ''
    try { stored = localStorage.getItem(STORAGE_KEY) || '' } catch { stored = '' }
    tokenInput.value = fromQuery || stored
    try { if (fromQuery) localStorage.setItem(STORAGE_KEY, fromQuery) } catch { /* 存不了也不影响急停 */ }

    function token() { return tokenInput.value.trim() }

    // 反馈文案保持原样，只把成功/失败映射到颜色。
    function say(text, tone) {
      messageLine.textContent = text
      messageLine.className = tone === undefined ? '' : tone
    }

    // 状态行左侧的药丸：读取中/未配置=off，在线=ok，已急停/失败=bad。
    function setPill(kind, text) {
      statusPill.className = 'pill ' + kind
      statusPill.textContent = text
    }

    document.getElementById('save-token').addEventListener('click', () => {
      try { localStorage.setItem(STORAGE_KEY, token()) } catch { /* 存不了只影响下次自动填充 */ }
      say('已保存', 'ok')
      void refresh()
    })

    function renderLocked(locked) {
      lockedBanner.classList.toggle('on', locked)
      panicButton.disabled = locked
    }

    async function api(path, init) {
      const headers = { 'x-control-token': token(), ...(init && init.headers ? init.headers : {}) }
      // 超时是必要的：没有它，一次挂起的 fetch 会让状态行永远停在「正在读取」。
      return fetch(path, { ...(init || {}), signal: AbortSignal.timeout(6000), headers })
    }

    async function refresh() {
      if (token().length === 0) {
        renderLocked(false)
        setPill('off', '未配置')
        statusLine.textContent = '需要 token'
        return
      }
      try {
        const response = await api('/api/snapshot')
        if (response.status === 401) {
          renderLocked(false)
          setPill('bad', 'token 无效')
          statusLine.textContent = 'token 无效'
          return
        }
        // 非 2xx（例如 500）不是快照：绝不能当成「未锁定/可输出」来渲染。
        if (!response.ok) {
          throw new Error(`控制台返回 HTTP ${response.status}`)
        }
        const snapshot = await response.json()
        // 形状校验：只有带 devices 数组的才是快照，其余一律按「状态未知」处理。
        if (snapshot === null || typeof snapshot !== 'object' || !Array.isArray(snapshot.devices)) {
          throw new Error('控制台返回了非快照响应')
        }
        // 横幅由快照驱动而不是本地状态：别的设备也可能已经急停。
        renderLocked(snapshot.locked === true)
        const count = snapshot.devices.length
        if (snapshot.locked === true) {
          setPill('bad', '已急停')
          statusLine.textContent = '输出已锁定 · ' + count + ' 台设备'
        } else {
          setPill('ok', '在线')
          statusLine.textContent = '可输出 · ' + count + ' 台设备'
        }
      } catch (error) {
        // 与改动前一致：网络失败只报错，不改按钮/横幅状态（避免把「已锁定」
        // 误判成「可再次急停」），但急停按钮必须保持可点——它可能在重试。
        setPill('bad', '连接失败')
        statusLine.textContent = '连接失败：' + (error && error.message ? error.message : String(error))
        if (!lockedBanner.classList.contains('on')) panicButton.disabled = false
      }
    }

    async function panic() {
      if (token().length === 0) {
        say('需要 token', 'bad')
        setPill('off', '未配置')
        return
      }
      panicButton.disabled = true
      say('正在急停…')
      try {
        const response = await api('/api/panic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'phone' }),
        })
        if (!response.ok) {
          const body = await response.json().catch(() => ({}))
          say('急停失败：' + (body.error || response.status), 'bad')
          return
        }
        setPill('bad', '已急停')
        say('已急停', 'ok')
      } catch (error) {
        say('急停失败：' + (error && error.message ? error.message : String(error)), 'bad')
      } finally {
        // 失败重试是带外急停的生命线：除非快照已确认锁定，否则按钮必须恢复可点。
        // 旧实现依赖 refresh() 成功来解禁，网络抖动时会让按钮永久禁用。
        panicButton.disabled = lockedBanner.classList.contains('on')
        // 失败时也刷新一次，把按钮的禁用状态交还给快照（例如锁定其实已生效）。
        void refresh()
      }
    }

    panicButton.addEventListener('click', () => { void panic() })
    setInterval(() => { void refresh() }, 1_000)
    void refresh()
  })()
</script>
</body>
</html>
