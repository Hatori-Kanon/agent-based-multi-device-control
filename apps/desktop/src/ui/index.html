<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  v3 单窗口应用页：游玩 / 设备 / 设置三个视图共用这一张页面，视图切换由
  /shell.js 完成。页面本身不做业务逻辑：所有状态都来自 dashboard 的 JSON API。

  token 只从地址栏读一次，之后只进 `x-control-token` 请求头 —— 不写本地存储、
  不写 DOM。CSP 与合并前一致：没有外链脚本/字体/图片。

  设备视图（#view-device）的 id 统一加 dev 前缀，游玩视图（#view-play）沿用
  play.js 既有约定；设置视图（#view-settings）只有标记，逻辑在 settings.js。
  两个轮询视图在隐藏时停止，切回时立即刷新一次。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Embodied · 游玩 / 设备 / 设置</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body data-view="play">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-title">Embodied</span>
    </div>
    <nav class="nav" aria-label="视图">
      <button class="nav-tab active" id="navPlay" type="button" data-view-target="play" aria-controls="view-play" aria-pressed="true">游玩</button>
      <button class="nav-tab" id="navDevice" type="button" data-view-target="device" aria-controls="view-device" aria-pressed="false">设备</button>
      <button class="nav-tab" id="navSettings" type="button" data-view-target="settings" aria-controls="view-settings" aria-pressed="false">设置</button>
    </nav>
    <span class="topbar-spacer"></span>
    <div class="topbar-meta">
      <span class="pill" id="conn" aria-live="polite">连接中…</span>
      <span class="pill off" id="sessionState" aria-live="polite">未开局</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-danger" id="panic" type="button" title="立即停止所有输出并锁定">紧急停止</button>
    </div>
  </header>

  <!-- ── 游玩视图（默认） ─────────────────────────────────────────────── -->
  <section id="view-play" data-view="play">
    <div class="lock-banner" id="lockBanner" role="alert">
      <span><strong>输出已被锁定。</strong></span>
      <button class="btn btn-sm" id="unlock" type="button">解锁</button>
    </div>

    <main class="main main-play">
      <!-- 未开局：大厅。 -->
      <div class="lobby" id="lobby">
        <div class="lobby-grid">
          <section class="card card-hero lobby-card">
            <h2 class="card-title">开局</h2>
            <div class="field-row">
              <label class="field-label" for="packSelect">内容包</label>
              <select id="packSelect">
                <option value="" disabled>（读取中…）</option>
              </select>
            </div>
            <div class="pack-import-row">
              <button class="mini" id="packImport" type="button">导入内容包</button>
              <input id="packFile" type="file" accept=".zip,application/zip" hidden>
              <span class="pack-import-status" id="packImportStatus" aria-live="polite"></span>
            </div>
            <div class="field-row">
              <label class="field-label" for="plannedMinutes">计划时长</label>
              <input id="plannedMinutes" type="number" min="1" max="240" step="5" value="30">
              <span class="hint">分钟</span>
            </div>
            <div class="auto-run-row">
              <label class="auto-run-toggle"><input type="checkbox" id="autoLobbyEnabled"> 自动运行</label>
              <span class="auto-run-value" id="autoLobbyValue">20s</span>
            </div>
            <div class="auto-run-row auto-run-window">
              <span class="auto-run-axis">最短
                <input id="autoLobbyMin" type="range" min="10" max="60" step="1" value="20" aria-label="自动运行最短等待（秒）">
              </span>
              <span class="auto-run-axis">最长
                <input id="autoLobbyMax" type="range" min="10" max="60" step="1" value="20" aria-label="自动运行最长等待（秒）">
              </span>
            </div>
            <button class="btn btn-accent btn-lg btn-block" id="start" type="button">开局</button>
          </section>

          <section class="card lobby-card soft-caps-card">
            <h2 class="card-title">设备与软上限</h2>
            <div id="softCapsLobby">
              <div class="hint">读取中…</div>
            </div>
          </section>
        </div>
      </div>

      <!-- 进行中：舞台 + 右轨。 -->
      <div class="session-view" id="sessionView" style="display:none">
        <section class="stage">
          <div class="stage-head">
            <span class="phase-chip" id="phaseChip">未开局</span>
            <span class="turn-chip" id="turnInfo">未开局</span>
            <span class="stage-timer" id="stageTimer">—</span>
          </div>

          <!-- 一列到底的会话：所有消息按时间从上到下，最新一条在底部。 -->
          <div class="thread" id="lines" role="log" aria-live="polite" aria-label="对话">
            <div class="hint">还没有台词</div>
          </div>

          <div id="choicesPanel" style="display:none">
            <div class="choices" id="choices"></div>
          </div>

          <form class="composer" id="composer">
            <textarea id="message" rows="2" placeholder="开局后可以发言…" aria-label="你的发言"></textarea>
            <button class="btn btn-accent" id="send" type="submit" disabled>发送</button>
          </form>
        </section>

        <aside class="rail">
          <section class="card">
            <h2 class="card-title">状态</h2>
            <dl class="stats" id="status">
              <dt>状态</dt><dd>未开局</dd>
              <dt>阶段</dt><dd>—</dd>
              <dt>时间</dt><dd>—</dd>
              <dt>内容包</dt><dd>—</dd>
            </dl>
          </section>

          <section class="card">
            <h2 class="card-title">自动运行</h2>
            <div class="auto-run-row">
              <label class="auto-run-toggle"><input type="checkbox" id="autoRunEnabled"> 自动运行</label>
              <span class="auto-run-value" id="autoRunValue">20s</span>
            </div>
            <div class="auto-run-row auto-run-window">
              <span class="auto-run-axis">最短
                <input id="autoRunMin" type="range" min="10" max="60" step="1" value="20" aria-label="自动运行最短等待（秒）">
              </span>
              <span class="auto-run-axis">最长
                <input id="autoRunMax" type="range" min="10" max="60" step="1" value="20" aria-label="自动运行最长等待（秒）">
              </span>
            </div>
          </section>

          <section class="card">
            <h2 class="card-title">设备与软上限</h2>
            <div id="devices"><div class="hint">读取中…</div></div>
          </section>
        </aside>
      </div>
    </main>

    <footer class="bottombar">
      <button class="btn" id="pause" type="button" disabled>暂停</button>
      <button class="btn" id="resume" type="button" disabled>继续</button>
      <button class="btn" id="end" type="button" disabled>结束</button>
    </footer>
  </section>

  <!-- ── 设备视图（点顶栏「设备」切过来） ──────────────────────────────── -->
  <section id="view-device" data-view="device" hidden>
    <div class="lock-banner" id="devLockBanner" role="alert">
      <span><strong>输出已被锁定。</strong></span>
      <button class="btn btn-sm" id="devUnlock" type="button">解锁</button>
    </div>

    <main class="main main-console">
      <aside class="rail rail-left">
        <section class="card">
          <h2 class="card-title">设备管理</h2>
          <button class="btn btn-accent btn-sm btn-block" id="devAddDevice" type="button">＋ 添加设备</button>
        </section>

        <section class="card">
          <h2 class="card-title">运行状态</h2>
          <dl class="stats">
            <dt>连接</dt><dd><span class="pill off" id="devConnState">连接中…</span></dd>
            <dt>设备</dt><dd id="devStatDevices">—</dd>
            <dt>通道</dt><dd id="devStatChannels">—</dd>
            <dt>锁定</dt><dd id="devLockState">—</dd>
          </dl>
        </section>
      </aside>

      <div class="column">
        <!-- 设备卡每 500ms 重建一次，不能整块当作 live region（读屏器会反复朗读）。
             需要播报的状态在左栏「运行状态」与锁定横幅上。 -->
        <div id="devDevices"></div>

        <section class="card">
          <h2 class="card-title">波形库</h2>
          <div class="import-row">
            <input type="text" id="devWfName" placeholder="波形名称" aria-label="新波形名称">
            <button class="mini" id="devWfImport" type="button">导入</button>
          </div>
          <textarea id="devWfFrames" rows="2" aria-label="波形帧序列" placeholder="0A0A0A0A00000000 0A0A0A0A64646464"></textarea>
          <div class="wf-grid" id="devWfGrid" style="margin-top:10px"></div>
        </section>
      </div>
    </main>
  </section>

  <!-- ── 设置视图（点顶栏「设置」切过来；逻辑在 /settings.js） ─────────── -->
  <section id="view-settings" data-view="settings" hidden>
    <main class="main main-settings">
      <section class="card settings-card">
        <h2 class="card-title">模型</h2>
        <div class="field-row">
          <label class="field-label" for="setProvider">服务商</label>
          <input id="setProvider" type="text" autocomplete="off" spellcheck="false">
        </div>
        <div class="field-row">
          <label class="field-label" for="setModel">模型</label>
          <input id="setModel" type="text" autocomplete="off" spellcheck="false">
        </div>
        <div class="field-row">
          <label class="field-label" for="setBaseUrl">接口地址</label>
          <input id="setBaseUrl" type="text" autocomplete="off" spellcheck="false">
        </div>
        <div class="field-row">
          <label class="field-label" for="setApiKey">API 密钥</label>
          <input id="setApiKey" type="password" placeholder="sk-…" autocomplete="new-password">
        </div>
        <div class="settings-actions">
          <button class="btn btn-accent btn-sm" id="setLlmSave" type="button">保存</button>
          <button class="btn btn-ghost btn-sm" id="setLlmClearKey" type="button" hidden>清除密钥</button>
          <span class="settings-status" id="setLlmStatus" aria-live="polite"></span>
        </div>
        <p class="settings-warning" id="setLlmWarning" aria-live="polite" hidden></p>
      </section>

      <section class="card settings-card">
        <h2 class="card-title">摄像头</h2>
        <div class="field-row">
          <label class="field-label"><input type="checkbox" id="setCamEnabled" aria-label="启用摄像头"> 启用</label>
        </div>
        <div class="field-row">
          <label class="field-label" for="setCamDevice">设备</label>
          <select id="setCamDevice" aria-label="摄像头设备">
            <option value="">—</option>
          </select>
          <button class="mini" id="setCamRefresh" type="button" aria-label="刷新摄像头列表">刷新</button>
          <span class="settings-status" id="setCamStatus" aria-live="polite"></span>
        </div>
      </section>

      <section class="card settings-card">
        <h2 class="card-title">麦克风</h2>
        <div class="field-row">
          <label class="field-label"><input type="checkbox" id="setMicEnabled" aria-label="启用麦克风"> 启用</label>
        </div>
        <div class="field-row">
          <label class="field-label" for="setMicDevice">设备</label>
          <select id="setMicDevice" aria-label="麦克风设备">
            <option value="">—</option>
          </select>
          <button class="mini" id="setMicRefresh" type="button" aria-label="刷新麦克风列表">刷新</button>
          <span class="settings-status" id="setMicStatus" aria-live="polite"></span>
        </div>
      </section>
    </main>
  </section>
</div>

<div class="toast" id="err" role="status" aria-live="polite"></div>

<dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmText">
  <p id="confirmText"></p>
  <div class="modal-actions">
    <button class="btn btn-ghost" id="confirmCancel" type="button">取消</button>
    <button class="btn btn-accent" id="confirmOk" type="button">确定</button>
  </div>
</dialog>

<div class="hold-overlay" id="holdOverlay" aria-hidden="true">
  <div class="hold-card">
    <div class="hold-title">紧急停止</div>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>
</div>

<div class="modal" id="devAddDialog" style="display:none">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="devAddDialogTitle">
    <h3 id="devAddDialogTitle">添加设备</h3>
    <label class="radio"><input type="radio" name="addProto" value="coyote" checked>郊狼 · DG-LAB Coyote</label>
    <label class="radio"><input type="radio" name="addProto" value="xhtkj">谜姬 / XHTKJ</label>
    <label class="radio"><input type="radio" name="addProto" value="ankni">安可尼旋转棒 · ANKNI</label>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="devAddCancel" type="button">取消</button>
      <button class="btn btn-accent" id="devAddConfirm" type="button">添加</button>
    </div>
  </div>
</div>

<script src="/shell.js"></script>
<!-- 波形柱状图的纯几何计算；play.js 直接读 window.EmbodiedChartMath，
     所以必须在它之前加载。 -->
<script src="/chart-math.js"></script>
<script src="/play.js"></script>
<script src="/app.js"></script>
<script src="/settings.js"></script>
</body>
</html>
